  <body>
    <!-- Skip-Journey Accessibility Links (TASK.md §3.5: C: skip-journey link) -->

    <!-- Persistent WebGL Liquid Stage Shader Canvas -->
    <div id="liquid-stage-wrap" aria-hidden="true">
      <canvas id="liquid-canvas"></canvas>
    </div>

    <!-- Signature "Ride the Packet" Viewport SVG Trail & Glowing Packet -->
    <div id="journey-overlay" class="journey-overlay" aria-hidden="true">
      <svg id="journey-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
        <path
          id="journey-guide-path"
          d="M 830 140 C 920 240, 120 310, 160 430 C 200 545, 860 585, 840 700 C 820 815, 160 855, 500 960"
          fill="none"
          stroke="rgba(11,11,15,0.12)"
          stroke-width="2.5"
          stroke-dasharray="6 8"
        />
        <path
          id="journey-active-trail"
          d="M 830 140 C 920 240, 120 310, 160 430 C 200 545, 860 585, 840 700 C 820 815, 160 855, 500 960"
          fill="none"
          stroke="#FF5A36"
          stroke-width="5"
          stroke-linecap="round"
        />
      </svg>
      <div id="riding-packet" class="riding-packet">
        <span class="packet-core"></span>
        <span class="packet-tag" id="riding-packet-tag">#001</span>
      </div>
    </div>

    <!-- Custom Playful Tactile Cursor -->
    <div id="journey-cursor" class="journey-cursor" aria-hidden="true">
      <span class="j-cursor-dot"></span>
      <span class="j-cursor-pill" id="j-cursor-pill"></span>
    </div>

            <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />
            <circle
              id="preloader-ring-circle"
              cx="60"
              cy="60"
              r="50"
              fill="none"
              stroke="#C6FF3D"
              stroke-width="4.5"
              stroke-linecap="round"
              transform="rotate(-90 60 60)"
            />
          </svg>
          <div class="preloader-packet-ball"></div>
        </div>
        <p class="preloader-order-txt" id="preloader-order-txt">Order #001 placed…</p>
        <span class="preloader-pct" id="preloader-pct">0%</span>

            aria-pressed="false"
            title="Toggle UI Sound (Muted by default)"
          >
            <span id="sound-label">SFX OFF</span>
          </button>
          <button
            type="button"
            id="quality-toggle"
            class="pill-ctrl hide-xs"
            title="Toggle Shader & Physics Tier"

            <span id="quality-label">FX: HIGH</span>
          </button>
          <a href="#contact" class="cta-pill" data-nav-link>Contact</a>
        </div>

      <div id="journey-wrap"></div>
